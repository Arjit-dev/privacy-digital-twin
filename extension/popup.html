<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Privacy Twin</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="container" id="authSection">
    <h2 id="title">Login</h2>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button id="actionBtn">Login</button>

    <p>
        <span id="toggleMode">Signup</span>
    </p>

    <p id="status"></p>
</div>


<!-- 🔥 SETUP PANEL -->
<div class="container" id="setupSection" style="display:none;">

    <h2>Privacy Setup</h2>

    <label><input type="checkbox" id="publicProfile"> Public Profile</label>
    <label><input type="checkbox" id="locationSharing"> Location Sharing</label>
    <label><input type="checkbox" id="twoFactorAuth"> Two Factor Auth</label>
    <label><input type="checkbox" id="publicWifiUsage"> Public WiFi Usage</label>
    <label><input type="checkbox" id="deviceEncrypted"> Device Encrypted</label>
    <label><input type="checkbox" id="autoUpdates"> Auto Updates</label>

    <input type="number" id="thirdPartyApps" placeholder="No. of Third Party Apps" />

    <select id="passwordStrength">
        <option value="weak">Weak Password</option>
        <option value="strong">Strong Password</option>
    </select>

    <button id="saveProfile">Save Profile</button>

    <button id="logoutBtn">Logout</button>

    <p id="setupStatus"></p>

</div>

<script src="popup.js"></script>
</body>
</html>
